[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tjm"
description = "Dense retrieval for talent-job matching: zero-shot evaluation, retrieve-then-rerank cascades, and ranking fairness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = [
    "pytest >= 8.3.0, < 9",
    "coverage >= 7.6.0, < 8",
    "pytest-cov >= 5.0.0, < 6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "tjm.__version__"}
dependencies = {file = "requirements.txt"}

[tool.ruff]
line-length = 119
select = ["E", "F", "UP"]
